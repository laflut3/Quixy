name: Review policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_run:
    workflows: [Review event]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: read
  statuses: write

concurrency:
  group: review-policy
  cancel-in-progress: false

jobs:
  review-policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check maintainer approval
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_ID: ${{ github.event.repository.owner.id }}
        run: |
          # Query GitHub directly. Never use code or artifacts from the PR.
          pulls=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main" --jq '.[] | .number')
          for number in $pulls; do
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number")
            sha=$(jq -r '.merge_commit_sha // empty' <<< "$pr")
            [[ -n "$sha" ]] || continue

            state=failure
            reason='An independent maintainer approval is required'
            author=$(jq -r '.user.login' <<< "$pr")
            head=$(jq -r '.head.sha' <<< "$pr")
            if [[ "$(jq -r '.user.id' <<< "$pr")" == "$OWNER_ID" ]]; then
              state=success
              reason='Pull request authored by the repository owner'
            else
              reviewers=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$number/reviews" |
                jq -r --arg author "$author" --arg head "$head" '
                  add | map(select(.user.login and .user.login != $author
                    and (.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")))
                  | group_by(.user.login)[] | max_by(.id)
                  | select(.state == "APPROVED" and .commit_id == $head) | .user.login')
              for reviewer in $reviewers; do
                permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$reviewer/permission" --jq '.permission')
                case "$permission" in
                  admin|maintain|write)
                    state=success
                    reason='Approved by a maintainer'
                    break
                    ;;
                esac
              done
            fi

            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
              -f "state=$state" -f context=maintainer-review -f "description=$reason" >/dev/null
          done
