name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONTAINER_REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/laflut3/quixy-kernel

jobs:
  conventions:
    name: conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check fork, branch, and commit conventions
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BRANCH_NAME: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          HEAD_USER: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$HEAD_REPO" == "$BASE_REPO" && "$HEAD_USER" != "dependabot[bot]" ]]; then
            permission="$(gh api "repos/$BASE_REPO/collaborators/$HEAD_USER/permission" --jq '.permission')"
            case "$permission" in
              admin|maintain|write) ;;
              *)
                echo "Open pull requests from a fork unless you have write access to the official repository."
                exit 1
                ;;
            esac
          fi

          if [[ ! "$BRANCH_NAME" =~ ^[a-z][a-z0-9-]*/[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo "Branch name must use a type prefix, for example feat/boot-protocol or fix/boot."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$BASE_SHA" HEAD; then
            echo "Rebase your branch onto the latest main."
            exit 1
          fi

          if [[ -n "$(git rev-list --merges "$BASE_SHA..HEAD")" ]]; then
            echo "Remove merge commits from your branch by rebasing onto main."
            exit 1
          fi

          if [[ ! "$PR_TITLE" =~ ^[a-z][a-z0-9-]*(\([a-z0-9._/-]+\))?:\ .+ ]]; then
            echo "Use type: summary for the pull request title, which becomes the squash commit subject."
            exit 1
          fi

          while IFS= read -r subject; do
            if [[ ! "$subject" =~ ^[a-z][a-z0-9-]*(\([a-z0-9._/-]+\))?:\ .+ ]]; then
              echo "Commit subject must use type: summary, for example feat: add boot entry."
              echo "Invalid subject: $subject"
              exit 1
            fi
          done < <(git log --format=%s "$BASE_SHA..HEAD")

  stupid-check:
    name: stupid-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fail if STUPID.md is in the pull request diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          if grep -Fxq 'STUPID.md' <<< "$files"; then
            echo "::error title=STUPID.md detected::Remove STUPID.md before this pull request can pass."
            exit 1
          fi
          echo "STUPID.md is not present in the pull request diff."

  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
        with:
          toolchain: stable
      - run: cargo test --locked
      - name: Package the binary built for integration tests
        run: tar -C target/debug -czf quixy-kernel.tar.gz quixy-kernel
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rust-build
          path: quixy-kernel.tar.gz
          if-no-files-found: error

  coverage:
    name: coverage
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - run: cargo install --locked cargo-llvm-cov --version 0.9.1
      - name: Measure unit test coverage
        run: cargo llvm-cov --locked --lib --json --summary-only --output-path coverage.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unit-coverage
          path: coverage.json
      - name: Require more than 80 percent line coverage
        run: |
          jq '.data[0].totals.lines' coverage.json
          jq -e '.data[0].totals.lines | .count > 0 and (.covered * 5 > .count * 4)' coverage.json

  build:
    name: build
    needs: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: rust-build
      - name: Run the compiled binary
        run: |
          tar -xzf quixy-kernel.tar.gz
          ./quixy-kernel

  docker-lint:
    name: docker-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install hadolint
        run: |
          wget -O "$RUNNER_TEMP/hadolint" https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64
          chmod +x "$RUNNER_TEMP/hadolint"
      - name: Lint Dockerfile
        run: "$RUNNER_TEMP/hadolint Dockerfile"

  trivy-fs:
    name: trivy-fs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          trivy-config: trivy.yaml
          cache: false
      - name: Upload filesystem scan results
        if: always() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  image-amd64:
    name: image-amd64
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Build and push amd64 image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=buildkit-amd64
          cache-to: type=gha,mode=max,scope=buildkit-amd64

  image-arm64:
    name: image-arm64
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Build and push arm64 image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          platforms: linux/arm64
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=buildkit-arm64
          cache-to: type=gha,mode=max,scope=buildkit-arm64

  image-manifest:
    name: image-manifest
    needs: [image-amd64, image-arm64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Publish multi-architecture manifest
        run: >-
          docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.IMAGE_NAME }}@${{ needs.image-amd64.outputs.digest }}
          ${{ env.IMAGE_NAME }}@${{ needs.image-arm64.outputs.digest }}

  image-trivy-amd64:
    name: image-trivy-amd64
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Build amd64 image for scanning
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          push: false
          load: true
          platforms: linux/amd64
          tags: quixy-kernel:${{ github.sha }}
          cache-from: |
            type=gha,scope=buildkit-amd64
            type=gha,scope=buildkit-trivy-amd64
          cache-to: type=gha,mode=max,scope=buildkit-trivy-amd64
      - name: Scan amd64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: quixy-kernel:${{ github.sha }}
          format: sarif
          output: trivy-image-amd64.sarif
          trivy-config: trivy.yaml
          cache: false
      - name: Upload amd64 image scan results
        if: always() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          sarif_file: trivy-image-amd64.sarif
          category: trivy-image-amd64

  image-trivy-arm64:
    name: image-trivy-arm64
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Build arm64 image for scanning
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          push: false
          load: true
          platforms: linux/arm64
          tags: quixy-kernel:${{ github.sha }}
          cache-from: |
            type=gha,scope=buildkit-arm64
            type=gha,scope=buildkit-trivy-arm64
          cache-to: type=gha,mode=max,scope=buildkit-trivy-arm64
      - name: Scan arm64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: quixy-kernel:${{ github.sha }}
          format: sarif
          output: trivy-image-arm64.sarif
          trivy-config: trivy.yaml
          cache: false
      - name: Upload arm64 image scan results
        if: always() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          sarif_file: trivy-image-arm64.sarif
          category: trivy-image-arm64

  release:
    name: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Release tags must point to a commit on main."
            exit 1
          fi
      - name: Check release tag format
        shell: bash
        run: |
          set -euo pipefail
          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ ! "$RELEASE_TAG" =~ $semver_re ]]; then
            echo "Invalid release tag: $RELEASE_TAG. Expected vMAJOR.MINOR.PATCH."
            exit 1
          fi
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check source image exists
        run: docker buildx imagetools inspect "$IMAGE_NAME:$(git rev-parse HEAD)"
      - name: Tag release image
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:${RELEASE_TAG#v} \
            "$IMAGE_NAME:$(git rev-parse HEAD)"
      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
