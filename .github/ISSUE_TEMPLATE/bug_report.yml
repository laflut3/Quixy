name: Bug report
description: Report behavior that does not match the project's documented or expected behavior.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Describe one issue per report. Remove secrets and personal data from logs before posting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: State what failed and the impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest sequence of steps that reproduces the problem.
      placeholder: |
        1. Build or boot with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include the exact error when available.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the commit or release, host OS, target architecture, and relevant hardware or emulator details.
      placeholder: |
        Commit or release:
        Host OS:
        Target architecture:
        Hardware or emulator:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and additional context
      description: Paste relevant logs, screenshots, or a workaround. Remove secrets and personal data.
      render: text
    validations:
      required: false
